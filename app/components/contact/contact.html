<div class="row" ng-controller="ContactController as contactCtrl">
	<div class="col-xs-12">
		<form name="contactForm" class="contact-form" ng-submit="contactCtrl.send(contactForm)" novalidate>
			<div class="row contact-fields">
				<div class="col-xs-12 col-sm-5">
					<div class="form-group" ng-class="{'has-error': contactCtrl.showError(contactForm, contactForm.name)}">
						<label for="contact-name" class="control-label">Nombre</label>
						<input type="text" id="contact-name" name="name" class="form-control"
							ng-model="contactCtrl.message.name" required ng-maxlength="100">
						<div class="error-slot">
							<div ng-show="contactCtrl.showError(contactForm, contactForm.name)">
								<span class="help-block" ng-show="contactForm.name.$error.required">El nombre es obligatorio.</span>
								<span class="help-block" ng-show="contactForm.name.$error.maxlength">Máximo 100 caracteres.</span>
							</div>
						</div>
					</div>

					<div class="form-group" ng-class="{'has-error': contactCtrl.showError(contactForm, contactForm.email)}">
						<label for="contact-email" class="control-label">Email</label>
						<input type="email" id="contact-email" name="email" class="form-control"
							ng-model="contactCtrl.message.email" required>
						<div class="error-slot">
							<div ng-show="contactCtrl.showError(contactForm, contactForm.email)">
								<span class="help-block" ng-show="contactForm.email.$error.required">El email es obligatorio.</span>
								<span class="help-block" ng-show="contactForm.email.$error.email">Introduce un email válido.</span>
							</div>
						</div>
					</div>
				</div>

				<div class="col-xs-12 col-sm-7 contact-message">
					<div class="form-group" ng-class="{'has-error': contactCtrl.showError(contactForm, contactForm.text)}">
						<div class="label-row">
							<label for="contact-text" class="control-label">Mensaje</label>
							<span class="char-counter">{{ (contactForm.text.$viewValue || '').length }} / 1000</span>
						</div>
						<textarea id="contact-text" name="text" class="form-control" rows="6"
							ng-model="contactCtrl.message.text" required ng-minlength="10" ng-maxlength="1000"></textarea>
						<div class="error-slot">
							<div ng-show="contactCtrl.showError(contactForm, contactForm.text)">
								<span class="help-block" ng-show="contactForm.text.$error.required">El mensaje es obligatorio.</span>
								<span class="help-block" ng-show="contactForm.text.$error.minlength">Mínimo 10 caracteres.</span>
								<span class="help-block" ng-show="contactForm.text.$error.maxlength">Máximo 1000 caracteres.</span>
							</div>
						</div>
					</div>
				</div>
			</div>

			<div class="text-right">
				<music-button label="Enviar" status="contactCtrl.sendStatus"
					on-finish="contactCtrl.onSendFinished(contactForm)"></music-button>
			</div>
		</form>
	</div>
</div>
